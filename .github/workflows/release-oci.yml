# svcdoctor OCI publication pipeline.
#
# This workflow implements ADR 0062 sections 12-20. It does not decide anything;
# every rule it enforces was accepted in Phase 7.1-R and is normative there.
#
# The two structural ideas worth understanding before reading it:
#
#   1. THE GIT TAG IS THE ONLY VERSION AUTHORITY. Nothing here accepts a
#      version as input. `scripts/build-image.sh --emit` derives the version,
#      the revision and SOURCE_DATE_EPOCH from Git, and it is the same script a
#      developer runs locally — so there is exactly one derivation, not one for
#      humans and a second for CI that can drift from it.
#
#   2. THE SEMVER TAG IS APPLIED LAST. Everything is staged under an immutable
#      `sha-<commit>` tag, validated there by digest, and only then does
#      `:vX.Y.Z` get pointed at the digest that passed. `job.needs` is the
#      enforcement: `publish` cannot start until every gate has succeeded,
#      because GitHub will not run it. An aborted release therefore leaves
#      unreferenced blobs and a SHA tag, never a semver tag naming a partial
#      release.
#
# Measured in Phase 7.1-P against a local registry: `imagetools create --tag
# <semver> <repo>@<digest>` re-points the tag at the *existing* index digest
# without rewriting it, so step 2 above is achievable rather than aspirational.
#
# Third-party actions are pinned by commit SHA, not by tag. A tag is mutable and
# this workflow holds `packages: write` and an OIDC identity.

name: Release OCI

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Individual jobs escalate only what they need, and the
# escalation is visible at the job that uses it rather than granted globally.
permissions:
  contents: read

# Never cancel a release that may already be pushing artifacts. Two runs racing
# on one tag is the thing to prevent; interrupting a half-published one is not
# an improvement on it.
concurrency:
  group: oci-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Release identity
  # ---------------------------------------------------------------------------
  #
  # Establishes what is being released before anything is built, and refuses
  # every way the answer could be ambiguous.
  identity:
    name: Release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      revision: ${{ steps.derive.outputs.revision }}
      source_date_epoch: ${{ steps.derive.outputs.source_date_epoch }}
      sha_tag: ${{ steps.derive.outputs.sha_tag }}
      certificate_identity: ${{ steps.derive.outputs.certificate_identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags are required: the release identity is derived with
          # `git describe --exact-match`, which sees nothing in a shallow clone.
          fetch-depth: 0

      # ADR 0062 section 13. `v*` is the trigger filter and is deliberately
      # loose; this is the actual rule. `v0.3`, `v01.2.3`, `foo-v0.3.0` and
      # `v0.3.0-dev` are all rejected here rather than silently released.
      - name: Validate tag shape
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "release tag: $tag"

      # The workflow trigger says a tag was pushed. It does not say the tag
      # names this commit, and a build that claimed otherwise would publish a
      # semver that does not describe its own source.
      - name: Derive identity from Git
        id: derive
        run: |
          set -eu
          ./scripts/build-image.sh --emit >> "$GITHUB_OUTPUT"
          version="$(./scripts/build-image.sh --emit | sed -n 's/^version=//p')"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::derived version '$version' != triggering tag '${GITHUB_REF_NAME}'"
            exit 1
          fi
          # The **full** 40-character SHA, not an abbreviation. The staging
          # tag is an immutable identity and an abbreviated SHA is a registry
          # identity that can collide as the repository grows; a collision
          # would mean two sources claiming one immutable tag.
          echo "sha_tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The exact Fulcio SAN this release must produce. Computed here
          # because identity is this workflow's authority: the shared machinery
          # is told what it must be, and `cosign verify` is pinned to it rather
          # than to a pattern.
          echo "certificate_identity=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/oci-stage-verify.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"

      # ADR 0062 section 13: a published semver tag is immutable. Checking
      # before building means a re-release attempt fails in seconds rather than
      # after the whole pipeline, and it can never be resolved by overwriting.
      # Observation, not a gate — and the distinction is the whole of ADR 0062
      # §21's idempotency rule applied here.
      #
      # This used to fail on any existing tag. It could not do otherwise: it runs
      # before the build, so it does not yet know the digest this commit
      # produces, and "the tag exists" was the only question available. That made
      # it a gate that could not tell a legitimate re-run from an overwrite, and
      # the first time a release had to be resumed it refused the resume.
      #
      # The authority moved to `publish`, which runs after the build and can
      # compare. Nothing was given up: `publish` reuses the tag only when it
      # already resolves to the exact validated digest, and hard-stops otherwise,
      # so no path here or there can re-point a published semver tag. What is
      # lost is failing fast, which cost a few minutes on a case that is now
      # usually legitimate.
      - name: Record whether the semver tag is already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY,,}"
          token="$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          accept='application/vnd.oci.image.index.v1+json'
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: $accept" "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}")"
          if [ "$code" != "200" ]; then
            echo "${GITHUB_REF_NAME} is unpublished (HTTP $code) — first publication"
            exit 0
          fi
          existing="$(curl -sI -H "Authorization: Bearer $token" -H "Accept: $accept" \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}" \
            | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')"
          echo "::notice::${GITHUB_REF_NAME} is already published at ${existing}."
          echo "::notice::This run will reuse it if the build reproduces that exact digest, and stop if it does not. The publish job decides."

  # ---------------------------------------------------------------------------
  # 2. Source gates
  # ---------------------------------------------------------------------------
  source:
    name: Source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      # `make check` runs golangci-lint and refuses to pretend it passed when the
      # binary is absent, which is correct — and means CI has to install it.
      # ci.yml does that with golangci-lint-action; this pipeline cannot, because
      # that action *runs* the linter rather than installing one for `make check`
      # to call. Pinned to the version the Makefile requires, installed through
      # the Go module proxy so it is checksum-verified rather than fetched by a
      # piped shell script into a job that later holds packages: write.
      #
      # Found by the first real run of validate-oci.yml: the release workflow had
      # the same gap and would have failed here on v0.3.0.
      - name: Install golangci-lint
        run: |
          set -eu
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Quality gate
        run: make check
      - name: Race detector
        run: go test -count=1 -race ./...

  # ---------------------------------------------------------------------------
  # 3. Integration suites
  # ---------------------------------------------------------------------------
  #
  # All three, on a release tag, without exception. Kafka takes several minutes;
  # this is publication, not quick feedback, and PR-time cost is governed by
  # ci.yml and unchanged by this workflow.
  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [postgres, kafka, redpanda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Run suite
        run: make integration-${{ matrix.suite }}

  # ---------------------------------------------------------------------------
  # 4. The shared OCI machinery
  # ---------------------------------------------------------------------------
  #
  # Reproducibility, staging under the immutable `sha-<commit>` tag, index and
  # label validation, the vulnerability scan, the CycloneDX SBOM, provenance,
  # keyless signing, constrained verification, pull-by-digest and the native
  # hardened runtime smoke all live in `oci-stage-verify.yml`.
  #
  # They live there because `validate-oci.yml` runs the same file. Duplicating
  # this machinery so a validation workflow could rehearse it would have
  # rehearsed the duplicate: the two copies drift on the first edit that touches
  # only one, and the release path would be the one nobody ever exercised. As
  # written, every remote behaviour Phase 7.1-V proved — GHCR authentication,
  # native amd64 execution, keyless signing, referrer binding, pull-by-digest —
  # was proven about *this* code path.
  #
  # What the shared workflow is not allowed to do is decide identity. It is
  # handed a version, a revision, an epoch, a staging tag and the exact
  # certificate identity it must produce, and it contains no step that writes a
  # semver tag. Release authority stays here: the tag trigger above, and the
  # `publish` job below.
  stage-and-verify:
    name: OCI
    needs: [identity, source, integration]
    uses: ./.github/workflows/oci-stage-verify.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
      source_date_epoch: ${{ needs.identity.outputs.source_date_epoch }}
      sha_tag: ${{ needs.identity.outputs.sha_tag }}
      certificate_identity: ${{ needs.identity.outputs.certificate_identity }}
      run_arm64_smoke: ${{ vars.ENABLE_ARM64_SMOKE == 'true' }}

  # ---------------------------------------------------------------------------
  # 5. Publish the semver tag — LAST
  # ---------------------------------------------------------------------------
  #
  # `needs` is the enforcement. This job cannot run unless identity, the source
  # and integration gates and every gate inside the shared machinery have
  # succeeded, because GitHub will not schedule it. There is no ordering to get
  # wrong inside a script.
  #
  # This is also the one thing the shared workflow deliberately cannot do. A
  # semver tag is created here, in a workflow whose only trigger is a semver tag
  # push — so an artifact built from a branch has no path to this step.
  #
  # `imagetools create --tag` re-points the tag at the digest that was
  # validated; it does not rebuild or re-index. Measured in Phase 7.1-P.
  publish:
    name: Publish semver tag
    runs-on: ubuntu-latest
    needs: [identity, stage-and-verify]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ needs.stage-and-verify.outputs.digest }}
      reused: ${{ steps.preflight.outputs.exists }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-checked immediately before writing, and the check is a three-way
      # decision rather than a refusal.
      #
      # The earlier version failed on any existing tag. That was right while a
      # release could only ever be published once, and wrong the moment a run had
      # to be resumed: v0.3.2 published its image and then stopped before the
      # GitHub Release existed, and re-running the only workflow that can create
      # one would have failed here — on a tag this very pipeline had just written
      # correctly. A gate that cannot distinguish "already done" from "done
      # differently" forces the recovery path off the automated route, which is
      # exactly where mistakes get made.
      #
      # So the rule is the one `stage` already applies to `sha-<commit>`
      # (ADR 0062 §21): compare, then reuse or stop.
      #
      #   absent                          -> publish
      #   present, validated digest       -> reuse; write nothing
      #   present, any other digest       -> STOP. Never overwrite.
      #
      # The third case is not a tagging problem and must not be treated as one.
      # The tag was verified to name this commit and the build is reproducible,
      # so a different digest means the source produced different bits — and
      # re-pointing the tag would replace an artifact that signatures already
      # attest to. ADR 0062 §13: release the next patch version instead.
      - name: The semver tag is absent, or already holds the validated digest
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ needs.stage-and-verify.outputs.digest }}
        run: |
          set -eu
          [ -n "$WANT" ] || { echo "::error::no validated digest was produced"; exit 1; }
          repo="${GITHUB_REPOSITORY,,}"
          token="$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H "Accept: $accept" \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}")"

          if [ "$code" != "200" ]; then
            echo "semver tag ${GITHUB_REF_NAME} is absent (HTTP $code) — will publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing="$(curl -sI -H "Authorization: Bearer $token" -H "Accept: $accept" \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}" \
            | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')"

          if [ "$existing" != "$WANT" ]; then
            echo "::error::${IMAGE}:${GITHUB_REF_NAME} already exists. Semver tags are immutable (ADR 0062 §13)."
            echo "::error::published: ${existing}"
            echo "::error::validated: ${WANT}"
            echo "::error::Refusing to re-point it. The tag names this commit and the build is reproducible, so a different digest is a reproducibility failure, not a tagging problem. Release the next patch version instead."
            exit 1
          fi

          echo "semver tag already resolves to the validated digest — idempotent re-run, nothing to write"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Point the semver tag at the validated digest
        if: steps.preflight.outputs.exists != 'true'
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}@${{ needs.stage-and-verify.outputs.digest }}"

      # Unconditional, because it is the assertion both paths have to satisfy:
      # the one that just wrote the tag, and the one that decided not to.
      - name: Confirm the tag resolves to the verified digest
        run: |
          set -eu
          got="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" \
                  --format '{{json .Manifest.Digest}}' | tr -d '"')"
          want="${{ needs.stage-and-verify.outputs.digest }}"
          [ "$got" = "$want" ] || { echo "::error::tag resolves to $got, expected $want"; exit 1; }
          echo "${IMAGE}:${GITHUB_REF_NAME} -> $got"

  # ---------------------------------------------------------------------------
  # 6. GitHub Release — the human surface, last of all
  # ---------------------------------------------------------------------------
  #
  # A GitHub Release is a *publication surface bound to an immutable Git tag*. It
  # is not a version authority, not an OCI publication authority, and not a
  # second release pipeline. Everything it publishes already exists and has
  # already been verified: the tag, the digest, the signature, the SBOM and the
  # reviewed notes. This job builds nothing.
  #
  # It runs last because a Release is a claim that an artifact is available. Made
  # before `publish`, it would be a link to a tag that does not resolve; made in
  # parallel, it would be a race. `needs` is the enforcement, as everywhere else
  # here — GitHub will not schedule this until the semver tag has been published
  # and confirmed.
  #
  # v0.3.1 is the reason the failure semantics are written down rather than
  # assumed. A failure *here* is categorically different from a failure in the
  # gates: the OCI release is already valid and immutable, so the fix is to retry
  # this path for the same tag and digest, never to rebuild and never to burn a
  # patch version on a GitHub UI problem. See docs/RELEASE_FAILURE_PLAYBOOK.md §D.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [identity, stage-and-verify, publish]
    permissions:
      # Scoped to this job alone, and to the two things it actually does: write
      # the Release, and read back the signed SBOM attestation. The workflow
      # default stays `contents: read`, so no other job gains write.
      #
      # Deliberately absent: `id-token: write` (this job signs nothing — signing
      # happens in the shared machinery, against the digest) and
      # `packages: write` (this job publishes no image; `publish` above owns the
      # only registry write in the pipeline).
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The version is taken from `identity`, which derived it from Git. There is
      # no workflow input to supply one and no literal to edit, so there is no
      # way for this job to publish a Release naming a version the pipeline did
      # not build. The equality check makes the coupling explicit rather than
      # implicit in an expression.
      - name: Release identity is the tag, and comes from `identity`
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          set -eu
          [ -n "$VERSION" ] || { echo "::error::identity produced no version"; exit 1; }
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::identity says $VERSION, the tag says ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$REVISION" != "${GITHUB_SHA}" ]; then
            echo "::error::identity says $REVISION, the run is on ${GITHUB_SHA}"
            exit 1
          fi
          echo "publishing $VERSION at $REVISION"

      # The independent re-check ADR 0062 §20 step 13 leaves implicit. `publish`
      # confirmed the tag resolves to the validated digest at the moment it wrote
      # it; this asks the registry again, immediately before making a public
      # claim about it, and over plain HTTP rather than through buildx — so a
      # tag re-pointed between the two jobs stops the Release rather than being
      # advertised by it.
      - name: The semver tag still resolves to the validated digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ needs.stage-and-verify.outputs.digest }}
        run: |
          set -eu
          [ -n "$WANT" ] || { echo "::error::no validated digest was produced"; exit 1; }
          token="$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          got="$(curl -fsSI -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/manifests/${GITHUB_REF_NAME}" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          if [ "$got" != "$WANT" ]; then
            echo "::error::${IMAGE}:${GITHUB_REF_NAME} resolves to '$got', expected '$WANT'. Refusing to announce it."
            exit 1
          fi
          echo "${IMAGE}:${GITHUB_REF_NAME} -> $got"
          echo "DIGEST=$got" >> "$GITHUB_ENV"

      # ADR 0062 §17 requires the SBOM on the GitHub Release *as well as* on the
      # digest. The shared machinery already exported it and used that exact file
      # as the `cosign attest` predicate, so this downloads the bytes that were
      # signed rather than producing a second export — two exports are two
      # documents that can disagree, and only one of them would be attested.
      #
      # Downloading rather than recovering it from the attestation is also what
      # keeps verification in one place: a job here that pulled the attestation
      # back and checked it would be a second implementation of a gate that
      # `oci-stage-verify.yml` owns.
      - name: Fetch the attested CycloneDX SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-${{ needs.identity.outputs.sha_tag }}

      - name: The SBOM is present and is CycloneDX
        run: |
          set -eu
          [ -s sbom.cdx.json ] || { echo "::error::sbom.cdx.json is missing or empty"; exit 1; }
          python3 - <<'PY'
          import json
          b = json.load(open('sbom.cdx.json'))
          assert b.get('bomFormat') == 'CycloneDX', b.get('bomFormat')
          print(f"CycloneDX {b.get('specVersion')}, {len(b.get('components', []))} components")
          PY

      # The checked-in notes are the human authority and are reviewed before the
      # tag exists; the digest is machine truth and is only known now. Appending
      # rather than editing keeps them one source each — a digest hand-copied
      # into a tracked file is a second authority that silently goes stale.
      - name: Compose the release body
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          REVISION: ${{ needs.identity.outputs.revision }}
          AMD64: ${{ needs.stage-and-verify.outputs.amd64_digest }}
          ARM64: ${{ needs.stage-and-verify.outputs.arm64_digest }}
        run: |
          set -eu
          notes="docs/releases/${VERSION}.md"
          [ -f "$notes" ] || { echo "::error::$notes does not exist in the tagged tree"; exit 1; }
          cp "$notes" /tmp/body.md
          {
            printf '\n---\n\n## Published artifact\n\n'
            printf 'Verified at publication, from the tagged commit `%s`.\n\n' "$REVISION"
            printf '| | |\n|---|---|\n'
            printf '| Image | `%s:%s` |\n' "$IMAGE" "$VERSION"
            printf '| Index digest | `%s` |\n' "$DIGEST"
            printf '| `linux/amd64` | `%s` |\n' "$AMD64"
            printf '| `linux/arm64` | `%s` |\n' "$ARM64"
            printf '\nPin the digest in production; a tag is a name resolved at pull time.\n\n'
            printf '```sh\ndocker pull %s@%s\n```\n\n' "$IMAGE" "$DIGEST"
            printf 'The attached `sbom.cdx.json` is the CycloneDX SBOM recovered from the\n'
            printf 'signed attestation on this digest, not a separate export of it.\n'
          } >> /tmp/body.md

      # Stable semver is Latest; a prerelease never is. `identity` currently
      # accepts only vX.Y.Z, so this is always true today — it is written as a
      # rule anyway so that widening the tag shape later cannot silently promote
      # an `-rc.1` to the thing users land on.
      - name: Decide the Latest flag
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -eu
          case "$VERSION" in
            v*.*.*-*) echo "LATEST=false" >> "$GITHUB_ENV"; echo "$VERSION is a prerelease" ;;
            *)        echo "LATEST=true"  >> "$GITHUB_ENV"; echo "$VERSION is a stable release" ;;
          esac

      # Create, or verify what is already there. Re-running a release must be
      # safe, and "safe" here means *non-destructive*: an existing Release is
      # never deleted, recreated or edited, because it is a public object that
      # may already have been linked to and, once immutable, cannot be rewritten
      # at all. A mismatch stops the run for a human rather than being repaired
      # automatically — silently overwriting a Release that disagrees with this
      # run is exactly the failure this refuses to automate.
      - name: Create the GitHub Release, or verify the existing one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -eu
          title="svcdoctor ${VERSION}"

          if ! gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "no Release for $VERSION; creating it"
            args=""
            [ "$LATEST" = "true" ] && args="--latest" || args="--prerelease"
            # shellcheck disable=SC2086
            gh release create "$VERSION" \
              --verify-tag \
              --title "$title" \
              --notes-file /tmp/body.md \
              $args \
              sbom.cdx.json
            echo "created"
            exit 0
          fi

          echo "a Release already exists for $VERSION; verifying rather than replacing it"
          gh release view "$VERSION" --json tagName,name,isDraft,isPrerelease,body > /tmp/existing.json
          gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' > /tmp/latest.txt || echo "" > /tmp/latest.txt
          python3 - <<'PY'
          import json, os, sys
          want_tag  = os.environ['VERSION']
          want_name = f"svcdoctor {want_tag}"
          want_pre  = os.environ['LATEST'] != 'true'
          digest    = os.environ['DIGEST']
          r = json.load(open('/tmp/existing.json'))
          latest = open('/tmp/latest.txt').read().strip()
          bad = []
          if r['tagName']     != want_tag:  bad.append(f"tag is {r['tagName']!r}, expected {want_tag!r}")
          if r['name']        != want_name: bad.append(f"title is {r['name']!r}, expected {want_name!r}")
          if r['isDraft']:                  bad.append("release is a draft")
          if r['isPrerelease'] != want_pre: bad.append(f"prerelease is {r['isPrerelease']}, expected {want_pre}")
          if not want_pre and latest != want_tag:
                                            bad.append(f"Latest is {latest!r}, expected {want_tag!r}")
          if digest not in (r.get('body') or ''):
                                            bad.append(f"body does not record the release digest {digest}")
          if bad:
              print("::error::the existing Release does not match this run. Not overwriting it.")
              for b in bad: print(f"::error::  - {b}")
              sys.exit(1)
          print(f"existing Release for {want_tag} matches this run; nothing to do")
          PY

      # Read back from the API rather than trusting the create step's exit code.
      - name: Verify the published Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -eu
          gh release view "$VERSION" --json tagName,name,isDraft,isPrerelease,url,body \
            --jq '"tag=\(.tagName) title=\(.name) draft=\(.isDraft) prerelease=\(.isPrerelease)", "url=\(.url)"'
          latest="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$LATEST" = "true" ] && [ "$latest" != "$VERSION" ]; then
            echo "::error::Latest is $latest, expected $VERSION"
            exit 1
          fi
          echo "Latest = $latest"

  # ---------------------------------------------------------------------------
  # 7. Release summary
  # ---------------------------------------------------------------------------
  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [identity, stage-and-verify, publish, release]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## svcdoctor ${{ needs.identity.outputs.version }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ needs.identity.outputs.version }}\` |"
            echo "| Commit | \`${{ needs.identity.outputs.revision }}\` |"
            echo "| Image | \`${IMAGE}:${{ needs.identity.outputs.version }}\` |"
            echo "| Digest | \`${{ needs.stage-and-verify.outputs.digest }}\` |"
            echo "| linux/amd64 | \`${{ needs.stage-and-verify.outputs.amd64_digest }}\` |"
            echo "| linux/arm64 | \`${{ needs.stage-and-verify.outputs.arm64_digest }}\` |"
            echo "| Staging tag | \`${{ needs.identity.outputs.sha_tag }}\` |"
            echo "| Architectures | linux/amd64, linux/arm64 |"
            echo "| Scan, SBOM, provenance, signature | ${{ needs.stage-and-verify.result }} |"
            echo "| Semver tag published | ${{ needs.publish.result }} |"
            if [ "${{ needs.publish.outputs.reused }}" = "true" ]; then
              echo "| Semver tag | already held the validated digest; nothing was written |"
            else
              echo "| Semver tag | pointed at the validated digest by this run |"
            fi
            echo
            echo "Pin the digest in production:"
            echo
            echo '```'
            echo "${IMAGE}@${{ needs.stage-and-verify.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
