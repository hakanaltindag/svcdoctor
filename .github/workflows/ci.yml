name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      # The repository may legitimately contain zero Go packages before Phase 1.
      # Gates that require packages are skipped explicitly rather than faked.
      - name: Detect Go packages
        id: pkgs
        run: echo "count=$(go list ./... 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: make fmt-check

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Lint
        if: steps.pkgs.outputs.count != '0'
        # NOT SHA-pinned, deliberately and temporarily. ADR 0076 section 2.6
        # requires every third-party action to be pinned by commit SHA, and the
        # two above now are — their digests were taken from this repository's
        # own release workflows, which have carried them since Phase 7.1.
        #
        # No verified digest for golangci-lint-action@v9 exists anywhere in this
        # repository, and Phase 9.2B had no way to obtain one it could check.
        # Writing an unverified digest here would be worse than the tag it
        # replaced: a wrong one fails every pull request, and a *plausible* wrong
        # one is precisely the supply-chain defect the pin exists to prevent.
        #
        # Tracked in docs/BACKLOG.md as UX-S16-b. Pin it in the change that can
        # verify the digest against the upstream repository.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
