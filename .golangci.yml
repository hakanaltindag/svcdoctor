# golangci-lint configuration for svcdoctor.
#
# Pinned tool version: v2.13.1 (v2 config schema).
# Keep this in sync with GOLANGCI_LINT_VERSION in the Makefile and the version
# pinned in .github/workflows/ci.yml.
#
# Strategy: high signal, low noise, predictable CI.
# Only linters that earn their place are enabled. See docs/BACKLOG.md for the
# architecture rules that are intentionally deferred until the packages they
# govern actually contain Go code.

version: "2"

linters:
  default: none
  enable:
    - depguard      # architecture boundary enforcement (see settings below)
    - errcheck      # unhandled errors hide transport/protocol failures
    - forbidigo     # confines security.Reveal to the wire boundary (see below)
    - gosec         # security checks; earns its place now that TLS code exists
    - govet         # standard correctness checks
    - ineffassign   # assignments that are never used
    - noctx         # network calls must accept a context (see below)
    - staticcheck   # correctness, simplification, style (absorbs gosimple/stylecheck)
    - unused        # dead code

  # noctx was activated in Phase 2.2, when the first dialing code arrived. It
  # enforces the mechanism the execution-budget contract depends on: a network
  # call that takes no context cannot be cancelled, so svcdoctor's local budget
  # would be unenforceable and a hung dial would outlive the run that started it.
  # It caught a real net.Listen in this repository's own test the day it was
  # enabled.
  #
  # gosec was activated in Phase 2.3, when crypto/tls arrived and it finally had
  # something to check. Verified empirically: it flags G402 on the one line that
  # honours a caller's explicit request to skip verification. That line carries a
  # targeted nolint with its reason, because the value is a deliberate
  # per-attempt diagnostic mode recorded in the evidence as tls.verified=false —
  # see internal/probe/tls/params.go and docs/SECURITY.md. Suppressions of
  # crypto rules stay single-line and explained; a blanket exclusion would remove
  # the check that makes activating gosec worthwhile.
  #
  # bodyclose remains off: it checks HTTP response bodies and no code uses
  # net/http. See docs/BACKLOG.md.
  #
  # forbidigo was activated in Phase 3.2, when a Kafka wire package finally
  # existed to confine security.Reveal to. docs/BACKLOG.md carried that item with
  # the reopen condition "Kafka wire packages exist"; this is it. The lint lands
  # deliberately *before* the first credential byte, so the phase that adds
  # authentication cannot introduce a reveal in the wrong package and discover it
  # in review instead of in CI.
  #
  # depguard cannot express this. Reveal is reachable by any package that imports
  # internal/security, and an adapter must be able to import that package to hold
  # a Credential and check its endpoint binding. Banning the import would ban the
  # binding check with it. forbidigo bans the call instead, which is the thing
  # that actually turns a masked secret into bytes.

  settings:
    forbidigo:
      # Match against the full expression, so security.Reveal is recognized by
      # the call it is: an in-package call inside internal/security is not
      # written this way and is not the escape hatch being confined.
      analyze-types: false
      forbid:
        - pattern: '^security\.Reveal$'
          msg: >-
            security.Reveal turns a masked secret into plaintext. Only a service
            adapter's wire package may call it, immediately before the value goes
            on the socket. See docs/SECURITY.md, ADR 0027 and ADR 0030.
        - pattern: '^security\.Channel[A-Z]'
          msg: >-
            a security.Channel constant states what a connection proved, and only
            the transport chain that established the connection may state it.
            Every other layer propagates the value it was given. See ADR 0029.
    depguard:
      rules:
        # Diagnosis is a pure function over frozen evidence.
        # docs/ARCHITECTURE.md section 6, ADR 0002.
        diagnosis-is-pure:
          files:
            - "**/internal/diagnosis/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: diagnosis must not import probes; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: diagnosis must not import adapters; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: diagnosis produces findings; explaining them is a renderer's job
            - pkg: github.com/hakanaltindag/svcdoctor/internal/platform
              desc: diagnosis consumes normalized platform evidence, not collectors
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                diagnosis reads a frozen graph; a secret has no role in it and no
                path into it
            - pkg: net
              desc: diagnosis must not perform network I/O
            - pkg: net/http
              desc: diagnosis must not perform network I/O
            - pkg: crypto/tls
              desc: diagnosis must not perform TLS operations
            - pkg: os
              desc: diagnosis must not read files, the environment, or process state
            - pkg: os/exec
              desc: diagnosis must not run commands
            - pkg: math/rand
              desc: diagnosis must be deterministic
            - pkg: math/rand/v2
              desc: diagnosis must be deterministic

        # Redaction transforms one valid report into another. It performs no I/O
        # and reaches no other layer. docs/ARCHITECTURE.md section 6.2, ADR 0018.
        redaction-is-a-transformation:
          files:
            - "**/internal/security/redaction/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: redaction transforms a finished report; it collects nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: redaction transforms a finished report; it knows no protocol
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: redaction must not diagnose
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: redaction transforms domain values, never serialized output
            - pkg: net
              desc: redaction must not perform network I/O
            - pkg: net/http
              desc: redaction must not perform network I/O
            - pkg: os
              desc: redaction must not read files, the environment, or process state
            - pkg: os/exec
              desc: redaction must not run commands
            - pkg: math/rand
              desc: pseudonyms must be deterministic
            - pkg: math/rand/v2
              desc: pseudonyms must be deterministic
            - pkg: regexp
              desc: >-
                redaction is structural; a regex scan is a safety net over known
                values, not the mechanism

        # Probes are service-agnostic and produce observations, not diagnosis.
        # docs/ARCHITECTURE.md section 3.
        probe-is-service-agnostic:
          files:
            - "**/internal/probe/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: probes must not know about service adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: probes produce observations; they must not diagnose

        # Adapters own protocol semantics; they produce evidence and nothing else.
        # docs/ARCHITECTURE.md section 5.
        #
        # The diagnosis deny became expressible in Phase 3.1, when the first
        # adapter package arrived. An adapter that could import diagnosis could
        # reach a conclusion about the service it just measured, which is the
        # separation ADR 0002 exists to keep.
        adapter-does-not-render:
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: adapters must not render output
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: adapters produce evidence; interpreting it is diagnosis work

        # Renderers explain an existing report and discover nothing.
        # docs/ARCHITECTURE.md section 7.
        render-explains-only:
          files:
            - "**/internal/render/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: renderers must not execute probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: renderers must not execute adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: renderers must not produce findings
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                renderers explain a report that is already safe; discovering or
                holding secrets is not their job

        # Platform collects environment context, not diagnosis.
        # docs/ARCHITECTURE.md section 15.
        platform-collects-context:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: platform packages must not contain adapter logic
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: platform packages must not drive probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: platform packages must not produce diagnosis
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                platform collectors gather environment context; harvesting cloud
                or Kubernetes tokens is forbidden (docs/SECURITY.md item 9)

  # Report every issue on a line, not just the first.
  #
  # golangci-lint deduplicates by line by default, and that default silently
  # swallowed a security finding: a `security.Reveal` call sharing a line with
  # any other reported issue lost the race and the forbidigo message vanished.
  # It was found by re-verifying the ADR 0027 boundary against a deliberate
  # violation written as a one-line function, and it is exactly the failure mode
  # that record exists to prevent — a guard that holds except when it does not.
  #
  # The tree reports zero issues, so this adds no noise today; it removes a
  # condition under which the credential boundary could fail open.
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Test helpers legitimately ignore errors while asserting.
      - path: _test\.go$
        linters:
          - errcheck

      # The one place security.Reveal may be called: a service adapter's wire
      # package, which is the last layer before the socket and holds no state
      # between exchanges. As of Phase 3.2c there is exactly one call, in
      # internal/adapter/kafka/wire/saslauthenticate.go, and this exclusion is
      # what makes it legal there and illegal everywhere else. Verified in both
      # directions against deliberate violations before that call was written.
      - path: internal/adapter/[^/]+/wire/
        linters:
          - forbidigo

      # internal/security is where Reveal is defined and where its own leak
      # matrix proves what it returns. Those calls are in-package and are not
      # written as security.Reveal, but the exclusion is explicit rather than
      # incidental.
      - path: internal/security/
        linters:
          - forbidigo

      # The transport chain is the authority on what a connection proved: it
      # performed the handshake, so it is the one layer entitled to name a
      # security.Channel constant. Everywhere else the value is copied from the
      # connection it describes (ADR 0029).
      - path: internal/probe/transport/
        linters:
          - forbidigo

      # Tests may name a channel to assert one. Asserting a value is not
      # producing it, and the production paths are covered by mutation checks
      # that fail when a channel is forged or downgraded.
      - path: _test\.go$
        linters:
          - forbidigo

issues:
  # See the note above the exclusions block: deduplicating by line can hide a
  # security finding behind an unrelated one.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
