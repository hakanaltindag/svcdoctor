# golangci-lint configuration for svcdoctor.
#
# Pinned tool version: v2.13.1 (v2 config schema).
# Keep this in sync with GOLANGCI_LINT_VERSION in the Makefile and the version
# pinned in .github/workflows/ci.yml.
#
# Strategy: high signal, low noise, predictable CI.
# Only linters that earn their place are enabled. See docs/BACKLOG.md for the
# architecture rules that are intentionally deferred until the packages they
# govern actually contain Go code.

version: "2"

linters:
  default: none
  enable:
    - depguard      # architecture boundary enforcement (see settings below)
    - errcheck      # unhandled errors hide transport/protocol failures
    - forbidigo     # confines security.Reveal to the wire boundary (see below)
    - gosec         # security checks; earns its place now that TLS code exists
    - govet         # standard correctness checks
    - ineffassign   # assignments that are never used
    - noctx         # network calls must accept a context (see below)
    - staticcheck   # correctness, simplification, style (absorbs gosimple/stylecheck)
    - unused        # dead code

  # noctx was activated in Phase 2.2, when the first dialing code arrived. It
  # enforces the mechanism the execution-budget contract depends on: a network
  # call that takes no context cannot be cancelled, so svcdoctor's local budget
  # would be unenforceable and a hung dial would outlive the run that started it.
  # It caught a real net.Listen in this repository's own test the day it was
  # enabled.
  #
  # gosec was activated in Phase 2.3, when crypto/tls arrived and it finally had
  # something to check. Verified empirically: it flags G402 on the one line that
  # honours a caller's explicit request to skip verification. That line carries a
  # targeted nolint with its reason, because the value is a deliberate
  # per-attempt diagnostic mode recorded in the evidence as tls.verified=false —
  # see internal/probe/tls/params.go and docs/SECURITY.md. Suppressions of
  # crypto rules stay single-line and explained; a blanket exclusion would remove
  # the check that makes activating gosec worthwhile.
  #
  # bodyclose remains off: it checks HTTP response bodies and no code uses
  # net/http. See docs/BACKLOG.md.
  #
  # forbidigo was activated in Phase 3.2, when a Kafka wire package finally
  # existed to confine security.Reveal to. docs/BACKLOG.md carried that item with
  # the reopen condition "Kafka wire packages exist"; this is it. The lint lands
  # deliberately *before* the first credential byte, so the phase that adds
  # authentication cannot introduce a reveal in the wrong package and discover it
  # in review instead of in CI.
  #
  # depguard cannot express this. Reveal is reachable by any package that imports
  # internal/security, and an adapter must be able to import that package to hold
  # a Credential and check its endpoint binding. Banning the import would ban the
  # binding check with it. forbidigo bans the call instead, which is the thing
  # that actually turns a masked secret into bytes.

  settings:
    forbidigo:
      # Match against the full expression, so security.Reveal is recognized by
      # the call it is: an in-package call inside internal/security is not
      # written this way and is not the escape hatch being confined.
      analyze-types: false
      forbid:
        - pattern: '^security\.Reveal$'
          msg: >-
            security.Reveal turns a masked secret into plaintext. Only a service
            adapter's wire package may call it, immediately before the value goes
            on the socket. See docs/SECURITY.md, ADR 0027 and ADR 0030.
        # Two patterns rather than one, because the two facts have different
        # authorities and a single rule could only grant both to one package.
        # The messages are deliberately distinguishable: the exclusions below
        # match on their text, which is how a package is granted one authority
        # without receiving the other.
        - pattern: '^security\.ChannelTLS[A-Z]'
          msg: >-
            naming a TLS channel constant claims what a TLS handshake proved, and
            only internal/probe/tls performs one. Every other layer, including the
            transport chain, propagates the value that probe returned. See
            ADR 0029.
        - pattern: '^security\.ChannelPlaintext$'
          msg: >-
            naming a plaintext channel constant states that a connection was left
            in the clear, and only the component that decided not to establish
            encryption and observed that outcome may state it. See ADR 0029.
        # security.ChannelUnknown is deliberately not forbidden anywhere. This
        # rule exists to stop a layer manufacturing a claim it did not observe,
        # and ChannelUnknown is the absence of a claim: it is the zero value, it
        # is refused by every policy, and naming it is how a component declines to
        # classify a connection. The TLS probe returns it for a handshake that
        # produced no connection. Banning it would forbid the one channel value
        # that cannot overclaim, and the previous single-pattern rule caught it
        # only by accident.
    depguard:
      rules:
        # Diagnosis is a pure function over frozen evidence.
        # docs/ARCHITECTURE.md section 6, ADR 0002.
        diagnosis-is-pure:
          files:
            - "**/internal/diagnosis/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: diagnosis must not import probes; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: diagnosis must not import adapters; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: diagnosis produces findings; explaining them is a renderer's job
            - pkg: github.com/hakanaltindag/svcdoctor/internal/platform
              desc: diagnosis consumes normalized platform evidence, not collectors
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                diagnosis reads a frozen graph; a secret has no role in it and no
                path into it
            - pkg: net
              desc: diagnosis must not perform network I/O
            - pkg: net/http
              desc: diagnosis must not perform network I/O
            - pkg: crypto/tls
              desc: diagnosis must not perform TLS operations
            - pkg: os
              desc: diagnosis must not read files, the environment, or process state
            - pkg: os/exec
              desc: diagnosis must not run commands
            - pkg: math/rand
              desc: diagnosis must be deterministic
            - pkg: math/rand/v2
              desc: diagnosis must be deterministic

        # A service vocabulary package is a leaf: constants and nothing else.
        # ADR 0034 section 19 authorized internal/service/kafka on exactly that
        # basis, so the property is enforced rather than remembered. It exists
        # because depguard denies diagnosis the adapter import (above) and the
        # two layers still share three constants; a vocabulary package that grew
        # a dependency would become the shared service layer that decision
        # declined to create.
        service-vocabulary-is-a-leaf:
          files:
            - "**/internal/service/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: a service vocabulary holds constants; protocol logic stays in the adapter
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: a service vocabulary collects nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: a service vocabulary concludes nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: a service vocabulary explains nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/platform
              desc: a service vocabulary reads no environment
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: a service vocabulary holds no secret and no credential
            - pkg: net
              desc: a service vocabulary performs no I/O
            - pkg: net/http
              desc: a service vocabulary performs no I/O
            - pkg: crypto/tls
              desc: a service vocabulary performs no TLS operations
            - pkg: os
              desc: a service vocabulary reads no files, environment or process state
            - pkg: os/exec
              desc: a service vocabulary runs no commands

        # Redaction transforms one valid report into another. It performs no I/O
        # and reaches no other layer. docs/ARCHITECTURE.md section 6.2, ADR 0018.
        redaction-is-a-transformation:
          files:
            - "**/internal/security/redaction/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: redaction transforms a finished report; it collects nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: redaction transforms a finished report; it knows no protocol
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: redaction must not diagnose
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: redaction transforms domain values, never serialized output
            - pkg: net
              desc: redaction must not perform network I/O
            - pkg: net/http
              desc: redaction must not perform network I/O
            - pkg: os
              desc: redaction must not read files, the environment, or process state
            - pkg: os/exec
              desc: redaction must not run commands
            - pkg: math/rand
              desc: pseudonyms must be deterministic
            - pkg: math/rand/v2
              desc: pseudonyms must be deterministic
            - pkg: regexp
              desc: >-
                redaction is structural; a regex scan is a safety net over known
                values, not the mechanism

        # The command boundary composes; it does not conclude.
        # docs/ARCHITECTURE.md section 6, ADR 0048 section 3.
        #
        # internal/cli names concrete things on purpose — the system resolver and
        # dialer, the PostgreSQL TLS plan, the local vantage producer, and from
        # Phase 5.2 internal/security and internal/security/redaction, both
        # authorized by ADR 0048 section 6 and ADR 0049 section 6.
        #
        # What it may never reach is diagnosis, which runs inside the application
        # over frozen evidence — a command that could call a rule could publish a
        # finding nobody measured — or a wire package, where the protocol and the
        # only authorized security.Reveal live. forbidigo already bans the call;
        # this bans the import that would put it in reach.
        cli-composes-and-does-not-conclude:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: the command boundary consumes a report; producing findings is diagnosis work
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter/postgres/wire
              desc: a wire package holds the protocol and the authorized Reveal; the CLI reaches neither
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter/kafka
              desc: no Kafka composition exists, and the CLI exposes no Kafka command
            - pkg: os/exec
              desc: the command runs no subprocesses
            - pkg: net/http
              desc: the command performs no network I/O of its own

        # A renderer explains a finished report and does nothing else.
        # docs/ARCHITECTURE.md section 6.4, ADR 0048 section 3.
        #
        # Activated in Phase 5.1, when internal/render gained its first Go file.
        # It was deliberately not written earlier: depguard rules are keyed on
        # files, so a rule guarding an empty directory guards nothing while
        # reading as though it guards something.
        #
        # internal/security/redaction is denied alongside the rest, and that is
        # the sharper half. Redaction happens at the output boundary *before* a
        # renderer runs; a renderer able to redact could emit shareable-looking
        # output whose own report security metadata still said LOCAL_FULL.
        render-is-presentation-only:
          files:
            - "**/internal/render/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/app
              desc: a renderer presents a result; it does not orchestrate one or choose an exit code
            - pkg: github.com/hakanaltindag/svcdoctor/internal/cli
              desc: a renderer is called by the command boundary and does not reach back into it
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: a renderer explains normalized evidence; it knows no protocol
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: a renderer collects nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: a renderer explains findings; producing them is diagnosis work
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: a renderer never holds a secret
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security/redaction
              desc: >-
                redaction is an output-boundary transformation applied before
                rendering; a renderer that redacted could contradict the report's
                own security metadata
            - pkg: github.com/hakanaltindag/svcdoctor/internal/platform
              desc: a renderer reads no environment
            - pkg: net
              desc: a renderer performs no network I/O
            - pkg: net/http
              desc: a renderer performs no network I/O
            - pkg: os/exec
              desc: a renderer runs no commands
            - pkg: math/rand
              desc: rendered output must be deterministic
            - pkg: math/rand/v2
              desc: rendered output must be deterministic

        # Probes are service-agnostic and produce observations, not diagnosis.
        # docs/ARCHITECTURE.md section 3.
        probe-is-service-agnostic:
          files:
            - "**/internal/probe/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: probes must not know about service adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: probes produce observations; they must not diagnose

        # Adapters own protocol semantics; they produce evidence and nothing else.
        # docs/ARCHITECTURE.md section 5.
        #
        # The diagnosis deny became expressible in Phase 3.1, when the first
        # adapter package arrived. An adapter that could import diagnosis could
        # reach a conclusion about the service it just measured, which is the
        # separation ADR 0002 exists to keep.
        adapter-does-not-render:
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: adapters must not render output
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: adapters produce evidence; interpreting it is diagnosis work

        # An adapter must not re-derive what a connection proved.
        #
        # Phase 4.2 made internal/probe/tls the authority for that fact and had
        # every other layer propagate it. The remaining way to forge one was to
        # reach past the value and interrogate the socket — a `*tls.Conn` type
        # assertion, or ConnectionState() — which needs crypto/tls. Denying the
        # import removes the capability rather than the temptation.
        #
        # It would also be wrong on its own terms: a wrapped connection defeats
        # the assertion, and configuration is not outcome. Test fixtures are
        # exempt because building a TLS peer to probe against is not re-deriving
        # anything. See ADR 0029 and docs/SECURITY.md.
        adapter-does-not-inspect-tls:
          files:
            - "**/internal/adapter/**"
            - "!**/*_test.go"
          deny:
            - pkg: crypto/tls
              desc: >-
                adapters propagate the channel the TLS probe established; they must
                not inspect a connection to re-derive it

        # Renderers explain an existing report and discover nothing.
        # docs/ARCHITECTURE.md section 7.
        render-explains-only:
          files:
            - "**/internal/render/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: renderers must not execute probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: renderers must not execute adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: renderers must not produce findings
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                renderers explain a report that is already safe; discovering or
                holding secrets is not their job

        # Platform collects environment context, not diagnosis.
        # docs/ARCHITECTURE.md section 15.
        platform-collects-context:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: platform packages must not contain adapter logic
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: platform packages must not drive probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: platform packages must not produce diagnosis
            - pkg: github.com/hakanaltindag/svcdoctor/internal/security
              desc: >-
                platform collectors gather environment context; harvesting cloud
                or Kubernetes tokens is forbidden (docs/SECURITY.md item 9)

  # Report every issue on a line, not just the first.
  #
  # golangci-lint deduplicates by line by default, and that default silently
  # swallowed a security finding: a `security.Reveal` call sharing a line with
  # any other reported issue lost the race and the forbidigo message vanished.
  # It was found by re-verifying the ADR 0027 boundary against a deliberate
  # violation written as a one-line function, and it is exactly the failure mode
  # that record exists to prevent — a guard that holds except when it does not.
  #
  # The tree reports zero issues, so this adds no noise today; it removes a
  # condition under which the credential boundary could fail open.
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Test helpers legitimately ignore errors while asserting.
      - path: _test\.go$
        linters:
          - errcheck

      # The one place security.Reveal may be called: a service adapter's wire
      # package, which is the last layer before the socket and holds no state
      # between exchanges. As of Phase 4.4b there are exactly two calls, one per
      # service — internal/adapter/kafka/wire/saslauthenticate.go and
      # internal/adapter/postgres/wire/scram.go — and this exclusion is what
      # makes them legal there and illegal everywhere else. Verified in both
      # directions against deliberate violations in every phase that touched it.
      #
      # **Narrowed in Phase 4.4b**, and the reason is worth recording. This
      # exclusion previously named no `text`, so it exempted wire packages from
      # *every* forbidigo rule — including the two channel-authority rules below.
      # A wire package could therefore name `security.ChannelTLSVerified`, which
      # ADR 0029's amendment reserves to `internal/probe/tls` alone. Nothing
      # exploited it: a wire package holds no connection and has no carrier to
      # put a channel on. But a blanket grant is not the same as a grant for the
      # one thing that was argued, and the gap was found by re-verifying the
      # boundary in every direction rather than only in the two that were
      # expected. Matching on the message text grants exactly the reveal
      # authority and nothing else, which is the technique the channel rules
      # already use.
      - path: internal/adapter/[^/]+/wire/
        linters:
          - forbidigo
        text: 'security.Reveal turns a masked secret'

      # internal/security is where Reveal is defined and where its own leak
      # matrix proves what it returns. Those calls are in-package and are not
      # written as security.Reveal, but the exclusion is explicit rather than
      # incidental.
      - path: internal/security/
        linters:
          - forbidigo

      # Channel authority follows the observation boundary, and these two rules
      # are what make that mechanical rather than a convention. Each grants one
      # package one fact, by matching the text of the specific forbid rule above,
      # so neither package can name the other's constant.
      #
      # Verified in both directions against deliberate violations: the transport
      # chain naming a TLS constant fails, and the TLS probe naming plaintext
      # fails. See ADR 0029 and docs/SECURITY.md.

      # The TLS probe performs the handshake, so it owns what the handshake
      # proved.
      - path: internal/probe/tls/
        linters:
          - forbidigo
        text: 'TLS channel constant'

      # The transport chain decides when to leave a connection in the clear, so
      # it owns that fact and no other.
      - path: internal/probe/transport/
        linters:
          - forbidigo
        text: 'plaintext channel constant'

      # The PostgreSQL adapter is the second component to earn that grant, and
      # it is the one ADR 0029's amendment predicted: PostgreSQL negotiates
      # encryption in band, so when the run chooses plaintext this adapter is the
      # component that decided not to ask and knows the socket was left in the
      # clear. It records that as a node, which is what finally gives a plaintext
      # channel something truthful to point at (ADR 0030's missing blocker).
      #
      # The grant is exactly one fact. Naming a TLS constant here still fails —
      # those come only from the probe that handshakes — and the security.Reveal
      # ban is untouched, which matters because this phase sends no credential.
      # Verified in every direction against deliberate violations.
      #
      # **Narrowed in Phase 4.4b**: the path was a prefix, so it also covered
      # internal/adapter/postgres/wire/, which never decides anything about
      # encryption and has no connection to leave in the clear. The pattern now
      # matches only files directly in the adapter directory.
      - path: internal/adapter/postgres/[^/]+\.go$
        linters:
          - forbidigo
        text: 'plaintext channel constant'

      # Tests may name a channel to assert one. Asserting a value is not
      # producing it, and the production paths are covered by mutation checks
      # that fail when a channel is forged or downgraded.
      - path: _test\.go$
        linters:
          - forbidigo

issues:
  # See the note above the exclusions block: deduplicating by line can hide a
  # security finding behind an unrelated one.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
