# golangci-lint configuration for svcdoctor.
#
# Pinned tool version: v2.13.1 (v2 config schema).
# Keep this in sync with GOLANGCI_LINT_VERSION in the Makefile and the version
# pinned in .github/workflows/ci.yml.
#
# Strategy: high signal, low noise, predictable CI.
# Only linters that earn their place are enabled. See docs/BACKLOG.md for the
# architecture rules that are intentionally deferred until the packages they
# govern actually contain Go code.

version: "2"

linters:
  default: none
  enable:
    - depguard      # architecture boundary enforcement (see settings below)
    - errcheck      # unhandled errors hide transport/protocol failures
    - govet         # standard correctness checks
    - ineffassign   # assignments that are never used
    - staticcheck   # correctness, simplification, style (absorbs gosimple/stylecheck)
    - unused        # dead code

  settings:
    depguard:
      rules:
        # Diagnosis is a pure function over frozen evidence.
        # docs/ARCHITECTURE.md section 6, ADR 0002.
        diagnosis-is-pure:
          files:
            - "**/internal/diagnosis/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: diagnosis must not import probes; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: diagnosis must not import adapters; it consumes normalized evidence only
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: diagnosis produces findings; explaining them is a renderer's job
            - pkg: github.com/hakanaltindag/svcdoctor/internal/platform
              desc: diagnosis consumes normalized platform evidence, not collectors
            - pkg: net
              desc: diagnosis must not perform network I/O
            - pkg: net/http
              desc: diagnosis must not perform network I/O
            - pkg: crypto/tls
              desc: diagnosis must not perform TLS operations
            - pkg: os
              desc: diagnosis must not read files, the environment, or process state
            - pkg: os/exec
              desc: diagnosis must not run commands
            - pkg: math/rand
              desc: diagnosis must be deterministic
            - pkg: math/rand/v2
              desc: diagnosis must be deterministic

        # Redaction transforms one valid report into another. It performs no I/O
        # and reaches no other layer. docs/ARCHITECTURE.md section 6.2, ADR 0018.
        redaction-is-a-transformation:
          files:
            - "**/internal/security/redaction/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: redaction transforms a finished report; it collects nothing
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: redaction transforms a finished report; it knows no protocol
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: redaction must not diagnose
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: redaction transforms domain values, never serialized output
            - pkg: net
              desc: redaction must not perform network I/O
            - pkg: net/http
              desc: redaction must not perform network I/O
            - pkg: os
              desc: redaction must not read files, the environment, or process state
            - pkg: os/exec
              desc: redaction must not run commands
            - pkg: math/rand
              desc: pseudonyms must be deterministic
            - pkg: math/rand/v2
              desc: pseudonyms must be deterministic
            - pkg: regexp
              desc: >-
                redaction is structural; a regex scan is a safety net over known
                values, not the mechanism

        # Probes are service-agnostic and produce observations, not diagnosis.
        # docs/ARCHITECTURE.md section 3.
        probe-is-service-agnostic:
          files:
            - "**/internal/probe/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: probes must not know about service adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: probes produce observations; they must not diagnose

        # Adapters own protocol semantics; they never render.
        # docs/ARCHITECTURE.md section 5.
        adapter-does-not-render:
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/render
              desc: adapters must not render output

        # Renderers explain an existing report and discover nothing.
        # docs/ARCHITECTURE.md section 7.
        render-explains-only:
          files:
            - "**/internal/render/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: renderers must not execute probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: renderers must not execute adapters
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: renderers must not produce findings

        # Platform collects environment context, not diagnosis.
        # docs/ARCHITECTURE.md section 15.
        platform-collects-context:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/hakanaltindag/svcdoctor/internal/adapter
              desc: platform packages must not contain adapter logic
            - pkg: github.com/hakanaltindag/svcdoctor/internal/probe
              desc: platform packages must not drive probes
            - pkg: github.com/hakanaltindag/svcdoctor/internal/diagnosis
              desc: platform packages must not produce diagnosis

  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Test helpers legitimately ignore errors while asserting.
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
