# The authentication matrix Phase 4.4b validates against.
local   all all        trust
hostssl all scramuser  all  scram-sha-256
host    all scramuser  all  scram-sha-256
hostssl all md5user    all  md5
host    all md5user    all  md5
hostssl all clearuser  all  password
host    all clearuser  all  password
hostssl all trustuser  all  trust
host    all trustuser  all  trust
hostssl all norights   all  scram-sha-256
host    all norights   all  scram-sha-256
# Refused before any credential is requested: the 28000 producer, and the only
# real source of AUTHZ_NOT_PERMITTED. It must precede the catch-all.
hostssl all rejectuser all  reject
host    all rejectuser all  reject
hostssl all all        all  scram-sha-256
host    all all        all  scram-sha-256
