services:
  postgres:
    image: postgres:18
    container_name: svcd-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-pw
      POSTGRES_DB: appdb
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "55432:5432"
    volumes:
      - ./certs:/etc/pg-certs:ro
      - ./pg_hba.conf:/etc/pg-hba.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init2.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/pg-certs/server.crt
      - -c
      - ssl_key_file=/etc/pg-certs/server.key
      - -c
      - hba_file=/etc/pg-hba.conf
      - -c
      - password_encryption=scram-sha-256

  # A second listener with TLS switched off, so `SSLRequest` really receives an
  # 'N' from a real server. It is the only way to measure POSTGRES_TLS_DECLINED
  # without simulating the answer, and simulating it would prove nothing about
  # the negotiation.
  #
  # Deliberately minimal: this server exists to say no to one byte. It shares no
  # volume with the TLS server and needs no roles beyond the default.
  postgres-plaintext:
    image: postgres:18
    container_name: svcd-pg-plaintext
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-pw
      POSTGRES_DB: appdb
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "55433:5432"
    command:
      - -c
      - ssl=off
      - -c
      - password_encryption=scram-sha-256
