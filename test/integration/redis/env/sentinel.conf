# A Sentinel, for the one thing R-17 measures: that svcdoctor stops when an
# endpoint says mode=sentinel.
#
# It monitors a loopback address that holds nothing. That is deliberate rather
# than lazy: svcdoctor asks a Sentinel nothing beyond the HELLO reply, so what
# this Sentinel monitors cannot affect the scenario — and a compose service name
# here fails at config-load time, because Sentinel resolves the monitored host
# before the network is up.
port 26379
protected-mode no
sentinel monitor svcd-main 127.0.0.1 6379 1
sentinel down-after-milliseconds svcd-main 5000
