# The RabbitMQ BASIC validation broker, loaded from conf.d so it takes
# precedence over the image's own defaults.
#
# Both listeners are on, because two scenarios have to disagree about the same
# broker: RAB-12 needs a plaintext port that svcdoctor will refuse to put a
# credential on, and RAB-01/RAB-02 need a verified-TLS port that it will. A
# fixture with only one of them could not distinguish "the credential was
# withheld" from "the endpoint was unreachable".
listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.certfile = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile  = /etc/rabbitmq/certs/server.key

# svcdoctor implements no client certificate (ADR 0068 §10), so the broker must
# not ask for one. `verify_none` is the fixture's honest admission of a product
# limit rather than a convenience: a broker demanding a client certificate would
# fail every scenario for a reason unrelated to what each one measures.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# RabbitMQ's own default, deliberately restored.
#
# The official image ships `conf.d/10-defaults.conf` containing
# `loopback_users.guest = false` — "allow access to the guest user from anywhere
# on the network" — which is a convenience for local development and the
# opposite of what a real broker does. This file is `30-` so it sorts after that
# one and wins.
#
# It has to win for RAB-05 to mean anything. The host reaches these containers
# through the Docker bridge and arrives as 172.x.x.x, so with the restriction in
# force `guest` is refused exactly as it would be on a real remote broker. With
# the image default left alone, `guest` was granted access and the scenario
# measured nothing.
loopback_users.guest = true
