# The node-limit broker's only difference from the scenario broker.
#
# `connection_max = 0` makes the node refuse **every** AMQP connection with
# `NOT_ALLOWED - connection refused: node connection limit (0) is reached`,
# which is the sentence ADR 0069's T5 template reconstructs and compares for
# byte equality.
#
# Zero rather than a small number, for the reason Phase 10.3 chose PostgreSQL's
# `CONNECTION LIMIT 0`: a limit that must be *reached* is a race — open N
# connections, hope the next one loses — and a limit of zero is a property of
# the configuration. Nothing is held open, nothing is timed, and the scenario
# cannot flake.
#
# It is a whole broker rather than a runtime `rabbitmqctl eval` on a shared one
# for the reason compose.yaml already gives for `rabbit-stop`: a node-wide
# setting perturbs every scenario on that node, so the ones that must not see it
# get their own. It also keeps the ceiling declarative and true from boot, with
# no ordering dependency between provisioning and the scenario that reads it.
#
# `rabbitmqctl` and `rabbitmq-diagnostics` reach the node over Erlang
# distribution rather than AMQP, so readiness and provisioning still work on a
# broker that accepts no AMQP connection at all.
connection_max = 0

# TLS, because the ceiling has to be reached at `Connection.Open` and svcdoctor
# will not put a credential on a plaintext channel (ADR 0068). A plaintext-only
# node-limit broker measures RABBITMQ_CREDENTIAL_WITHHELD — correctly, and not
# what RAB-26 is about. Measured: that is exactly what the first run of this
# fixture produced.
listeners.ssl.default = 5671

ssl_options.certfile = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile  = /etc/rabbitmq/certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
