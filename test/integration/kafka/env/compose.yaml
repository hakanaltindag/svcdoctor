# A real 3-broker Apache Kafka cluster in KRaft mode, for Phase 3 integration
# validation. Not used by `go test ./...`; see the README beside this file.
#
# Each broker publishes two listeners:
#
#   INTERNAL  broker-N:9094   inter-broker traffic, on the compose network
#   EXTERNAL  localhost:N9092 what svcdoctor connects to, from the host
#
# The split is what makes the advertised-listener scenarios possible. Corrupting
# a broker's EXTERNAL advertised address is exactly the production
# misconfiguration svcdoctor exists to find, and it leaves the cluster itself
# healthy because inter-broker traffic uses INTERNAL.
name: svcdoctor-kafka-validation

x-broker: &broker
  image: apache/kafka:4.0.0
  environment: &broker-env
    CLUSTER_ID: kQ8xY2ZwQ0eF3hJ5nL7pAw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093,2@broker-2:9093,3@broker-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  broker-1:
    <<: *broker
    hostname: broker-1
    container_name: svcd-broker-1
    ports: ["19092:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9094,EXTERNAL://${ADV_1:-localhost:19092}

  broker-2:
    <<: *broker
    hostname: broker-2
    container_name: svcd-broker-2
    ports: ["29092:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9094,EXTERNAL://${ADV_2:-localhost:29092}

  broker-3:
    <<: *broker
    hostname: broker-3
    container_name: svcd-broker-3
    ports: ["39092:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:9094,EXTERNAL://${ADV_3:-localhost:39092}
