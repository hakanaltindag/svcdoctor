// Test-only credentials for the throwaway validation cluster.
//
// These are fixture values for a container that exists for the duration of a
// local test run and listens on loopback. They are not a secret, they are not
// used anywhere else, and nothing outside test/integration/kafka reads them.
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="admin"
  password="admin-secret"
  user_admin="admin-secret"
  user_svcdoctor="svcdoctor-canary-secret";

  // Required for SCRAM-SHA-256, and it carries no credentials on purpose.
  //
  // Enabling a mechanism on a listener is not enough: without a login module
  // for it the broker cannot construct a SaslServer at all, and it answers by
  // closing the connection rather than by returning an error code. That reaches
  // a client as a bare EOF, which is indistinguishable from a network fault —
  // it is what this fixture did before Phase 6.2, and it cost an afternoon.
  //
  // The verifiers themselves live in the KRaft metadata log, created by the
  // Makefile's kafka-scram-users step, so there is nothing to declare here.
  org.apache.kafka.common.security.scram.ScramLoginModule required;
};
